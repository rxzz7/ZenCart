server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zencart_user_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG