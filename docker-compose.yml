# ZenCart – local multi-container environment
#
# Brings up shared infrastructure (MySQL, Kafka, Zookeeper, Zipkin) plus all
# five Spring Boot microservices. Copy `.env.example` to `.env` and fill in
# real values before running.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f auth-service
#   docker compose down -v
services:

  # ============================================================
  # MySQL
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: zencart-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-password}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # Kafka - KRaft mode
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: zencart-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single-node development setup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Required by the Confluent image for KRaft
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk


  # ============================================================
  # Zipkin
  # ============================================================

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zencart-zipkin
    restart: unless-stopped

    ports:
      - "9411:9411"


  # ============================================================
  # Eureka Server
  # ============================================================

  eureka-server:
    build:
      context: ./eureka-server-service

    container_name: zencart-eureka-server
    restart: unless-stopped

    ports:
      - "9090:9090"


  # ============================================================
  # Auth Service
  # ============================================================

  auth-service:
    build:
      context: ./auth-service

    container_name: zencart-auth-service
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

    ports:
      - "8081:8081"

    environment:
      SPRING_APPLICATION_NAME: USER-SERVICE

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zencart_user_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9090/eureka/

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}


  # ============================================================
  # Product Service
  # ============================================================

  product-service:
    build:
      context: ./product-service

    container_name: zencart-product-service
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started

    ports:
      - "8082:8082"

    environment:
      SPRING_APPLICATION_NAME: PRODUCT-SERVICE

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zencart_product_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9090/eureka/

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json


  # ============================================================
  # Order Service
  # ============================================================

  order-service:
    build:
      context: ./order-service

    container_name: zencart-order-service
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      SPRING_APPLICATION_NAME: ORDER-SERVICE

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zencart_order_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9090/eureka/

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json


  # ============================================================
  # Payment Service
  # ============================================================

  payment-service:
    build:
      context: ./payment-service

    container_name: zencart-payment-service
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started

    ports:
      - "8084:8084"

    environment:
      SPRING_APPLICATION_NAME: PAYMENT-SERVICE

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zencart_payment_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9090/eureka/

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json


  # ============================================================
  # Notification Service
  # ============================================================

  notification-service:
    build:
      context: ./notification-service

    container_name: zencart-notification-service
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started

    ports:
      - "8085:8085"

    environment:
      SPRING_APPLICATION_NAME: NOTIFICATION-SERVICE

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zencart_notification_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9090/eureka/

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}


  # ============================================================
  # API Gateway
  # ============================================================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: zencart-api-gateway
    restart: unless-stopped

    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started

    ports:
      - "8087:8087"

    environment:
      SPRING_APPLICATION_NAME: API-GATEWAY

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9090/eureka/


# ============================================================
# Volumes
# ============================================================

volumes:
  mysql_data: