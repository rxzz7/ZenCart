server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zencart_notification_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: password

  application:
    name: NOTIFICATION-SERVICE
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
#
#  flyway:
#    enabled: true
#    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
---
notification:
  kafka:
    consumer-group-id: notification-groupId

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9090/eureka