server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zencart_product_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: password

  application:
    name: PRODUCT-SERVICE
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG