server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zencart_payment_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: password

  application:
    name: PAYMENT-SERVICE
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
#
#  flyway:
#    enabled: true
#    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9090/eureka